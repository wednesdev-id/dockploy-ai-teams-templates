version: "3.8"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - paperclip-pgdata:/var/lib/postgresql/data

  headroom:
    image: ghcr.io/chopratejas/headroom:0.6.7
    restart: unless-stopped

  9router:
    image: decolua/9router:0.5.40
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}
      API_KEY_SECRET: ${API_KEY_SECRET}
      MACHINE_ID_SALT: ${MACHINE_ID_SALT}
      BASE_URL: http://${ROUTER_HOST}
      NEXT_PUBLIC_BASE_URL: http://${ROUTER_HOST}
      HEADROOM_URL: http://headroom:8787
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - 9router-data:/app/data
    depends_on:
      - headroom

  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    restart: unless-stopped
    pids_limit: 2048
    environment:
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
      PAPERCLIP_PUBLIC_URL: https://${PAPERCLIP_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      OPENAI_BASE_URL: "http://9router:20128/v1"
      OPENAI_API_KEY: "internal"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
      9router:
        condition: service_started

volumes:
  paperclip-pgdata:
  9router-data:
  paperclip-data:
