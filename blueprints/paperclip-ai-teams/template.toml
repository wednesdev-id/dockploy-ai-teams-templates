[variables]
paperclip_domain = "${domain}"
router_domain = "${domain}"
postgres_password = "${password:32}"
better_auth_secret = "${password:64}"
jwt_secret = "${password:64}"
initial_password = "${password:32}"
api_key_secret = "${password:64}"
machine_id_salt = "${password:32}"

[config]
env = [
  "PAPERCLIP_DOMAIN=${paperclip_domain}",
  "POSTGRES_PASSWORD=${postgres_password}",
  "BETTER_AUTH_SECRET=${better_auth_secret}",
  "ROUTER_HOST=${router_domain}",
  "JWT_SECRET=${jwt_secret}",
  "INITIAL_PASSWORD=${initial_password}",
  "API_KEY_SECRET=${api_key_secret}",
  "MACHINE_ID_SALT=${machine_id_salt}",
]
mounts = []

[[config.domains]]
serviceName = "paperclip"
port = 3100
host = "${paperclip_domain}"

[[config.domains]]
serviceName = "9router"
port = 20128
host = "${router_domain}"
